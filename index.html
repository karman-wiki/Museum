<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospecting Formula Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c1e14; color: #f0e6d2; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #3d2b1f; padding: 25px; border-radius: 12px; border: 2px solid #8b5a2b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #d4af37; text-shadow: 2px 2px 4px #000; margin-bottom: 30px; }
        .input-group { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; color: #c4a484; }
        input { background: #1a110a; border: 1px solid #8b5a2b; color: #fff; padding: 8px; border-radius: 4px; width: 60%; text-align: center; font-size: 1.1em; }
        .results-section { margin-top: 30px; border-top: 2px solid #8b5a2b; padding-top: 20px; }
        .result-card { background: #4e3629; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #d4af37; }
        .result-title { font-size: 0.9em; text-transform: uppercase; color: #d4af37; margin-bottom: 5px; }
        .result-value { font-size: 1.8em; font-weight: bold; font-family: 'Courier New', Courier, monospace; }
        .formula-hint { font-size: 0.8em; color: #a18262; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Prospecting Formula Calculator</h1>

    <div class="input-group">
        <label>Luck (L):</label>
        <input type="number" id="luck" value="42360" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>Capacity (C):</label>
        <input type="number" id="cap" value="8207" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>Shake Speed (s):</label>
        <input type="number" id="speed" value="644" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>Shake Strength (a):</label>
        <input type="number" id="strength" value="492" oninput="calculate()">
    </div>

    <div class="results-section">
        <div class="result-card">
            <div class="result-title">Total Shaking Efficiency (R)</div>
            <div id="r-score" class="result-value">0</div>
            <div class="formula-hint">L√C / (100C / 3sa + 2.5)</div>
        </div>

        <div class="result-card">
            <div class="result-title">Optimal Capacity (C-Opt)</div>
            <div id="c-opt" class="result-value" style="color: #4db8ff;">0</div>
            <div class="formula-hint">(2.5 * 3sa) / 100</div>
        </div>

        <div class="result-card">
            <div class="result-title">Shaking Penalty Time</div>
            <div id="penalty" class="result-value" style="color: #ff6b6b;">0s</div>
            <div class="formula-hint">100C / 3sa</div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        // Pull values from inputs
        const L = parseFloat(document.getElementById('luck').value) || 0;
        const C = parseFloat(document.getElementById('cap').value) || 0;
        const s = parseFloat(document.getElementById('speed').value) || 0;
        const a = parseFloat(document.getElementById('strength').value) || 0;

        // 1. Shaking Penalty calculation
        const shakePenalty = (100 * C) / (3 * s * a);
        document.getElementById('penalty').innerText = shakePenalty.toFixed(4) + "s";

        // 2. Optimal Capacity calculation
        const cOpt = (2.5 * 3 * s * a) / 100;
        document.getElementById('c-opt').innerText = Math.round(cOpt).toLocaleString();

        // 3. Shaking Efficiency (R)
        const numerator = L * Math.sqrt(C);
        const denominator = shakePenalty + 2.5;
        const R = numerator / denominator;
        
        document.getElementById('r-score').innerText = isFinite(R) ? R.toLocaleString(undefined, {maximumFractionDigits: 1}) : "0";
    }

    // Run once on load
    calculate();
</script>

</body>
</html>
