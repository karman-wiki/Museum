<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Buff Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #e0e0e0; display: flex; justify-content: center; padding: 20px; }
        .container { background-color: #252525; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 900px; border: 1px solid #444; }
        h1 { text-align: center; color: #fff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        .rarity-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .rarity-section { background: #2d2d2d; padding: 15px; border-radius: 8px; border-left: 5px solid #555; }
        
        /* Rarity Colors */
        .Common { border-color: #aaaaaa; } .Uncommon { border-color: #55ff55; } .Rare { border-color: #5555ff; }
        .Epic { border-color: #ff55ff; } .Legendary { border-color: #ffff55; } .Mythic { border-color: #ff5555; } .Exotic { border-color: #55ffff; }

        .display-slot { margin-bottom: 15px; padding: 10px; background: #353535; border-radius: 5px; }
        label { display: block; font-size: 0.9em; margin-bottom: 5px; color: #bbb; font-weight: bold; }
        select, input { width: 100%; padding: 8px; background: #1e1e1e; color: white; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; margin-bottom: 5px; }

        #results-box { background: #121212; padding: 20px; border-radius: 10px; border: 2px solid #333; }
        .result-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #222; }
        .result-item:last-child { border-bottom: none; }
        .val { font-weight: bold; color: #78e08f; }
        .neg { color: #eb4d4b; }
    </style>
</head>

const MODIFIERS = {
    "None": { mult: 0, stats: [] },
    "Treasured": { mult: 15, stats: ["Luck"], specialMult: 2 },
    "Voidtorn": { mult: 11, stats: ["Luck", "Capacity"] },
    "Electrified": { mult: 5, stats: ["DigSpeed", "ShakeSpeed"] },
    "Iridescent": { mult: 3.5, stats: ["Luck"] },
    "Crystalline": { mult: 3, stats: ["SizeBoost"] },
    "Irradiated": { mult: 2.5, stats: ["ModBoost"] },
    "Scorching": { mult: 2, stats: ["DigStrength"] },
    "Glowing": { mult: 1.6, stats: ["ShakeSpeed"] },
    "Pure": { mult: 1.35, stats: ["DigSpeed"] },
    "Shiny": { mult: 1.2, stats: ["ShakeStrength"] }
};

const RARITY_MOD_MULT = { "Common": 0.005, "Uncommon": 0.0075, "Rare": 0.0125, "Epic": 0.02, "Legendary": 0.03, "Mythic": 0.05, "Exotic": 0.08 };

function init() {
    const root = document.getElementById('ui-root');
    const rarities = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Mythic", "Exotic"];
    const counts = { Common: 3, Uncommon: 3, Rare: 3, Epic: 3, Legendary: 3, Mythic: 2, Exotic: 1 };

    rarities.forEach(rarity => {
        let section = document.createElement('div');
        section.className = `rarity-section ${rarity}`;
        section.innerHTML = `<h3>${rarity}</h3>`;
        
        for (let i = 0; i < counts[rarity]; i++) {
            let slot = document.createElement('div');
            slot.className = 'display-slot';
            const slotId = `${rarity}_${i}`;
            
            slot.innerHTML = `
                <label>Ore</label>
                <select id="ore_${slotId}" onchange="calculate()">
                    <option value="">Empty</option>
                    ${ORE_DATA[rarity].map(o => `<option value="${o.name}">${o.name}</option>`).join('')}
                </select>
                <label>Weight (KG)</label>
                <input type="number" id="kg_${slotId}" placeholder="Min: 0" value="0" oninput="calculate()">
                <label>Modifier</label>
                <select id="mod_${slotId}" onchange="calculate()">
                    ${Object.keys(MODIFIERS).map(m => `<option value="${m}">${m}</option>`).join('')}
                </select>
            `;
            section.appendChild(slot);
        }
        root.appendChild(section);
    });
    calculate();
}

function calculate() {
    let totals = { Luck: 1, DigAmount: 1, Capacity: 1, DigSpeed: 1, DigStrength: 1, ShakeStrength: 1, ShakeAmount: 1, ShakeSpeed: 1, SellBoost: 1, SizeBoost: 1, ModBoost: 1 };
    
    document.querySelectorAll('.rarity-section').forEach(section => {
        const rarity = section.querySelector('h3').innerText;
        section.querySelectorAll('.display-slot').forEach((slot, i) => {
            const oreName = document.getElementById(`ore_${rarity}_${i}`).value;
            const kg = parseFloat(document.getElementById(`kg_${rarity}_${i}`).value) || 0;
            const modName = document.getElementById(`mod_${rarity}_${i}`).value;

            if (!oreName) return;

            const ore = ORE_DATA[rarity].find(o => o.name === oreName);
            const weightMult = Math.min(1.5, kg / ore.minKg); // Assumed standard weight scaling for ores
            
            // Base Ore Bonus
            const stats = ore.bonus.split(', ').map(s => s.trim());
            stats.forEach(stat => {
                let cleanStat = stat.replace('-', '');
                let value = ore.maxBoost * weightMult;
                if (stat.startsWith('-')) value *= -1;
                
                // Handle complex multi-stat ores (Cryonic/Prismara/Flarebloom)
                if (ore.multiSpec && ore.multiSpec[cleanStat]) value = ore.multiSpec[cleanStat] * weightMult;
                if (ore.special && ore.special.stat === cleanStat) value = ore.special.val * weightMult;

                totals[cleanStat] += value;
            });

            // Modifier Bonus
            if (modName !== "None") {
                const mod = MODIFIERS[modName];
                let baseModVal = RARITY_MOD_MULT[rarity];
                if (modName === "Treasured") baseModVal *= 2;
                
                const modValue = baseModVal * mod.mult * weightMult;
                mod.stats.forEach(s => totals[s] += modValue);
            }
        });
    });

    const display = document.getElementById('totals-display');
    display.innerHTML = '';
    Object.entries(totals).forEach(([key, val]) => {
        if (val === 1) return;
        let colorClass = val < 1 ? 'neg' : '';
        display.innerHTML += `<div class="result-item"><span>${key}</span><span class="val ${colorClass}">x${val.toFixed(2)}</span></div>`;
    });
}

init();
</script>
