<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Buff Calculator | Final Logic</title>
    <style>
        :root {
            --bg: #0d0d12;
            --panel: #1a1a24;
            --slot: #242433;
            --text: #ffffff;
            --accent: #00d2ff;
            --Common: #95a5a6; --Uncommon: #2ecc71; --Rare: #3498db;
            --Epic: #9b59b6; --Legendary: #f1c40f; --Mythic: #e74c3c; --Exotic: #1abc9c;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; }
        .wrapper { display: flex; gap: 30px; padding: 40px; max-width: 1400px; width: 100%; box-sizing: border-box; }
        
        .gallery { flex: 3; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .rarity-card { background: var(--panel); border-radius: 12px; padding: 20px; border-top: 5px solid var(--r-color); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .rarity-card h3 { margin: 0 0 15px 0; font-size: 1rem; color: var(--r-color); text-transform: uppercase; letter-spacing: 1.5px; }

        .case { background: var(--slot); border-radius: 8px; padding: 15px; margin-bottom: 12px; border: 1px solid #333; }
        select { width: 100%; padding: 10px; background: #111; color: #fff; border: 1px solid #444; border-radius: 6px; margin-top: 5px; font-size: 0.9rem; }
        label { font-size: 0.75rem; color: #888; font-weight: bold; text-transform: uppercase; }

        .sidebar { flex: 1; position: sticky; top: 20px; height: fit-content; background: #151520; border-radius: 12px; padding: 30px; border: 1px solid #2d2d3d; }
        .sidebar h2 { margin-top: 0; font-size: 1.3rem; text-align: center; border-bottom: 2px solid #2d2d3d; padding-bottom: 15px; margin-bottom: 20px; }

        .stat-line { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #242433; }
        .stat-name { color: #ccc; }
        .stat-val { color: #00ffaa; font-weight: 800; font-family: monospace; font-size: 1.1rem; }
        .stat-val.neg { color: #ff4757; }

        .Common { --r-color: var(--Common); } .Uncommon { --r-color: var(--Uncommon); }
        .Rare { --r-color: var(--Rare); } .Epic { --r-color: var(--Epic); }
        .Legendary { --r-color: var(--Legendary); } .Mythic { --r-color: var(--Mythic); }
        .Exotic { --r-color: var(--Exotic); }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="gallery" class="gallery"></div>
    
    <div class="sidebar">
        <h2>TOTAL BUFFS</h2>
        <div id="totals"></div>
    </div>
</div>

<script>
const ORE_DATA = {
    "Common": [
        { n: "Amethyst", s: {"Dig Speed": 0.05} }, { n: "Blue Ice", s: {"Dig Speed": 0.05} },
        { n: "Copper", s: {"Size Boost": 0.04} }, { n: "Gold", s: {"Sell Boost": 0.05} },
        { n: "Obsidian", s: {"Size Boost": 0.04} }, { n: "Pearl", s: {"Shake Speed": 0.05} },
        { n: "Platinum", s: {"Dig Speed": 0.05} }, { n: "Pyrite", s: {"Capacity": 0.05} },
        { n: "Seashell", s: {"Capacity": 0.05} }, { n: "Silver", s: {"Shake Speed": 0.05} }
    ],
    "Uncommon": [
        { n: "Coral", s: {"Capacity": 0.08} }, { n: "Electrum", s: {"Sell Boost": 0.08} },
        { n: "Glowberry", s: {"Sell Boost": 0.08} }, { n: "Malachite", s: {"Modifier Boost": 0.08} },
        { n: "Neodymium", s: {"Shake Strength": 0.08} }, { n: "Rock Candy", s: {"Size Boost": 0.05} },
        { n: "Sapphire", s: {"Dig Speed": 0.08} }, { n: "Smoky Quartz", s: {"Shake Strength": 0.08} },
        { n: "Titanium", s: {"Dig Speed": 0.08} }, { n: "Topaz", s: {"Capacity": 0.08} },
        { n: "Zircon", s: {"Size Boost": 0.05} }
    ],
    "Rare": [
        { n: "Amber", s: {"Sell Boost": 0.13} }, { n: "Azuralite", s: {"Dig Speed": 0.13} },
        { n: "Candy Cane", s: {"Size Boost": 0.09} }, { n: "Diopside", s: {"Modifier Boost": 0.13} },
        { n: "Glacial Quartz", s: {"Dig Speed": 0.13} }, { n: "Gloomberry", s: {"Dig Speed": 0.13} },
        { n: "Jade", s: {"Modifier Boost": 0.13} }, { n: "Lapis Lazuli", s: {"Dig Speed": 0.13} },
        { n: "Meteoric Iron", s: {"Shake Strength": 0.13} }, { n: "Onyx", s: {"Modifier Boost": 0.13} },
        { n: "Peridot", s: {"Luck": 0.13} }, { n: "Pyrelith", s: {"Sell Boost": 0.13} },
        { n: "Ruby", s: {"Shake Strength": 0.13} }, { n: "Silver Clamshell", s: {"Shake Speed": 0.13} }
    ],
    "Epic": [
        { n: "Ammonite Fossil", s: {"Capacity": 0.2} }, { n: "Ashvein", s: {"Size Boost": 0.14} },
        { n: "Aurorite", s: {"Dig Speed": 0.2} }, { n: "Bone", s: {"Size Boost": 0.14} },
        { n: "Borealite", s: {"Dig Speed": 0.2} }, { n: "Cobalt", s: {"Dig Speed": 0.2} },
        { n: "Emerald", s: {"Luck": 0.2} }, { n: "Glowmoss", s: {"Modifier Boost": 0.2} },
        { n: "Golden Pearl", s: {"Capacity": 0.2} }, { n: "Iridium", s: {"Dig Speed": 0.2} },
        { n: "Lightshard", s: {"Dig Speed": 0.2} }, { n: "Mercury", s: {"Shake Strength": 0.2} },
        { n: "Moonstone", s: {"Shake Speed": 0.2} }, { n: "Opal", s: {"Shake Speed": 0.2} },
        { n: "Osmium", s: {"Size Boost": 0.2} }, { n: "Pyronium", s: {"Sell Boost": 0.2} }
    ],
    "Legendary": [
        { n: "Aetherite", s: {"Dig Speed": 0.3} }, { n: "Aquamarine", s: {"Dig Speed": 0.3} },
        { n: "Bismuth", s: {"Dig Speed": 0.3} }, { n: "Catseye", s: {"Capacity": 0.3} },
        { n: "Cinnabar", s: {"Size Boost": 0.21} }, { n: "Diamond", s: {"Luck": 0.3} },
        { n: "Dragon Bone", s: {"Size Boost": 0.21} }, { n: "Fire Opal", s: {"Size Boost": 0.21} },
        { n: "Firefly Stone", s: {"Capacity": 0.3} }, { n: "Gloomcap", s: {"Dig Speed": 0.3} },
        { n: "Lost Soul", s: {"Dig Speed": 0.3} }, { n: "Luminum", s: {"Capacity": 0.3} },
        { n: "Palladium", s: {"Sell Boost": 0.3} }, { n: "Peppermint Prism", s: {"Modifier Boost": 0.3} },
        { n: "Rose Gold", s: {"Shake Strength": 0.3} }, { n: "Specterite", s: {"Shake Speed": 0.3} },
        { n: "Starshine", s: {"Dig Speed": 0.15, "Shake Speed": 0.15} }, { n: "Tourmaline", s: {"Sell Boost": 0.3} },
        { n: "Uranium", s: {"Modifier Boost": 0.3} }, { n: "Volcanic Key", s: {"Size Boost": 0.21} }
    ],
    "Mythic": [
        { n: "Chrysoberyl", s: {"Luck": 0.5} }, { n: "Flarebloom", s: {"Luck": 0.75, "Size Boost": -0.5} },
        { n: "Frostshard", s: {"Dig Strength": 0.5} }, { n: "Inferlume", s: {"Luck": 0.5} },
        { n: "Mythril", s: {"Shake Strength": 0.5} }, { n: "Painite", s: {"Size Boost": 0.35} },
        { n: "Pink Diamond", s: {"Luck": 0.5} }, { n: "Prismara", s: {"Luck": 0.25, "Capacity": 0.25, "Dig Strength": 0.25, "Shake Strength": 0.25} },
        { n: "Radiant Gold", s: {"Sell Boost": 0.5} }, { n: "Red Beryl", s: {"Size Boost": 0.35} },
        { n: "Star Garnet", s: {"Size Boost": 0.35} }, { n: "Volcanic Core", s: {"Dig Strength": 0.25, "Size Boost": 0.2} },
        { n: "Vortessence", s: {"Capacity": 0.5} }
    ],
    "Exotic": [
        { n: "Astral Spore", s: {"Dig Speed": 0.8} }, { n: "Bloodstone", s: {"Size Boost": 0.56} },
        { n: "Cryonic Artifact", s: {"Dig Strength": 1.2, "Shake Strength": 1.2, "Dig Speed": -0.8, "Shake Speed": -0.8} },
        { n: "Dinosaur Skull", s: {"Sell Boost": 0.4, "Size Boost": 0.32} },
        { n: "North Star", s: {"Luck": 0.2, "Capacity": 0.2, "Dig Speed": 0.2, "Shake Speed": 0.2} },
        { n: "Pumpkin Soul", s: {"Size Boost": 0.56} }, { n: "Vineheart", s: {"Luck": 0.8} },
        { n: "Umbrite", s: {"Dig Speed": 0.4, "Shake Speed": 0.4} }, { n: "Voidstone", s: {"Luck": 0.4, "Capacity": 0.4} },
        { n: "Eternium", s: {"Luck": 0.32, "Dig Speed": 0.32, "Shake Speed": 0.32} }
    ]
};

const MOD_LIB = {
    "Treasured": {m: 15, stats: ["Luck"], t: true},
    "Voidtorn": {m: 11, stats: ["Luck", "Capacity"]},
    "Electrified": {m: 5, stats: ["Dig Speed", "Shake Speed"]},
    "Iridescent": {m: 3.5, stats: ["Luck"]},
    "Crystalline": {m: 3, stats: ["Size Boost"]},
    "Irradiated": {m: 2.5, stats: ["Modifier Boost"]},
    "Scorching": {m: 2, stats: ["Dig Strength"]},
    "Glowing": {m: 1.6, stats: ["Shake Speed"]},
    "Pure": {m: 1.35, stats: ["Dig Speed"]},
    "Shiny": {m: 1.2, stats: ["Shake Strength"]}
};

const RARITY_VALS = {
    'Common': 0.005, 'Uncommon': 0.0075, 'Rare': 0.0125,
    'Epic': 0.02, 'Legendary': 0.03, 'Mythic': 0.05, 'Exotic': 0.08
};

function init() {
    const gallery = document.getElementById('gallery');
    const layout = { Common: 3, Uncommon: 3, Rare: 3, Epic: 3, Legendary: 3, Mythic: 2, Exotic: 1 };

    Object.entries(layout).forEach(([rarity, count]) => {
        let card = document.createElement('div');
        card.className = `rarity-card ${rarity}`;
        card.innerHTML = `<h3>${rarity} Displays</h3>`;
        for (let i = 0; i < count; i++) {
            card.innerHTML += `
                <div class="case">
                    <label>Mineral</label>
                    <select id="ore_${rarity}_${i}" onchange="calc()">
                        <option value="">-- Empty --</option>
                        ${ORE_DATA[rarity].map(o => `<option value="${o.n}">${o.n}</option>`).join('')}
                    </select>
                    <div style="margin-top:10px">
                        <label>Modifier</label>
                        <select id="mod_${rarity}_${i}" onchange="calc()">
                            <option value="">None</option>
                            ${Object.keys(MOD_LIB).map(m => `<option value="${m}">${m}</option>`).join('')}
                        </select>
                    </div>
                </div>`;
        }
        gallery.appendChild(card);
    });
    calc();
}

function calc() {
    let totals = { "Luck": 0, "Dig Speed": 0, "Capacity": 0, "Shake Speed": 0, "Size Boost": 0, "Sell Boost": 0, "Modifier Boost": 0, "Shake Strength": 0, "Dig Strength": 0 };

    Object.keys(layout_ref = {Common:3, Uncommon:3, Rare:3, Epic:3, Legendary:3, Mythic:2, Exotic:1}).forEach(rarity => {
        for (let i = 0; i < layout_ref[rarity]; i++) {
            const oreN = document.getElementById(`ore_${rarity}_${i}`).value;
            const modN = document.getElementById(`mod_${rarity}_${i}`).value;

            if (oreN) {
                const ore = ORE_DATA[rarity].find(o => o.n === oreN);
                for (let [s, v] of Object.entries(ore.s)) totals[s] += v;
            }

            if (modN) {
                const mod = MOD_LIB[modN];
                let base = RARITY_VALS[rarity];
                
                // Prompt Rule: Rare and below show as 0.01x increase (Treasured doubled)
                if (['Common', 'Uncommon', 'Rare'].includes(rarity)) {
                    base = 0.01 / mod.m; 
                }

                let modVal = base * mod.m;
                if (mod.t) modVal *= 2;

                mod.stats.forEach(s => { if(totals[s] !== undefined) totals[s] += modVal; });
            }
        }
    });

    const list = document.getElementById('totals');
    list.innerHTML = '';
    Object.entries(totals).forEach(([name, val]) => {
        const final = 1 + val;
        list.innerHTML += `<div class="stat-line"><span class="stat-name">${name}</span><span class="stat-val ${final < 1 ? 'neg' : ''}">x${final.toFixed(2)}</span></div>`;
    });
}

init();
</script>
</body>
</html>
