<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Buff Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #151515; --panel: #252525; --header: #ffce44;
            --common: #ffffff; --uncommon: #77ff77; --rare: #5cb2ff;
            --epic: #ca83ff; --legendary: #ffdf5d; --mythic: #ff6b8b; --exotic: #ff9d42;
        }

        body {
            background: radial-gradient(circle at center, #2c2c2c 0%, #0a0a0a 100%);
            color: white; font-family: 'Lexend', sans-serif; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .ribbon {
            background: var(--header); color: #4b3600;
            padding: 15px 60px; font-family: 'Fredoka One', cursive;
            font-size: 2rem; border-radius: 0 0 30px 30px;
            box-shadow: 0 8px 0 #b18c00, 0 15px 30px rgba(0,0,0,0.5);
            text-transform: uppercase; margin-bottom: 30px; text-align: center;
        }

        /* Player Stats Panel */
        .base-stats-panel {
            background: rgba(0,0,0,0.7); border: 2px solid var(--header);
            border-radius: 20px; padding: 20px; margin-bottom: 30px;
            width: 100%; max-width: 900px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;
        }

        .base-input-group { display: flex; flex-direction: column; }
        .base-input-group label { font-size: 0.75rem; color: var(--header); font-weight: bold; margin-bottom: 5px; }
        .base-input-group input { 
            background: #111; color: #fff; border: 1px solid #555; 
            padding: 10px; border-radius: 8px; font-family: 'Lexend'; font-size: 1rem;
        }

        .museum-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px; width: 100%; max-width: 1200px; padding-bottom: 200px;
        }

        .card {
            background: var(--panel); border-radius: 20px; padding: 18px;
            border: 4px solid #444; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .card-header { font-family: 'Fredoka One'; font-size: 1.3rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .COMMON { border-color: var(--common); } .UNCOMMON { border-color: var(--uncommon); }
        .RARE { border-color: var(--rare); } .EPIC { border-color: var(--epic); }
        .LEGENDARY { border-color: var(--legendary); } .MYTHIC { border-color: var(--mythic); }
        .EXOTIC { border-color: var(--exotic); }

        .slot { background: rgba(0,0,0,0.4); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid #555; }
        
        select {
            width: 100%; background: #111; color: #fff; border: 1px solid #666;
            padding: 10px; border-radius: 8px; font-family: 'Lexend'; margin-top: 6px; font-size: 0.9rem;
        }

        /* Floating Footer */
        .footer-stats {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1a1a1a; border-top: 5px solid var(--header);
            padding: 20px; display: flex; justify-content: center; gap: 30px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9); z-index: 1000; flex-wrap: wrap;
        }

        .stat-box { text-align: center; min-width: 140px; border-right: 1px solid #333; padding-right: 15px; }
        .stat-box:last-child { border: none; }
        .stat-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-val { font-family: 'Fredoka One'; font-size: 1.5rem; color: var(--header); display: block; margin: 4px 0; }
        .stat-pct { font-size: 0.85rem; color: #77ff77; font-weight: bold; background: rgba(119, 255, 119, 0.1); padding: 2px 8px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="ribbon">Museum Buff Calculator</div>

<div class="base-stats-panel">
    <div class="base-input-group"><label>BASE LUCK</label><input type="number" id="base-luck" value="1" step="0.1" oninput="calc()"></div>
    <div class="base-input-group"><label>BASE DIG SPEED (%)</label><input type="number" id="base-dig" value="100" oninput="calc()"></div>
    <div class="base-input-group"><label>BASE SHAKE SPEED (%)</label><input type="number" id="base-shake" value="100" oninput="calc()"></div>
    <div class="base-input-group"><label>BASE SIZE (%)</label><input type="number" id="base-size" value="100" oninput="calc()"></div>
</div>

<div class="museum-grid" id="ui-root"></div>

<div class="footer-stats">
    <div class="stat-box"><span class="stat-label">Final Luck</span><span class="stat-val" id="final-luck">1.00</span><span class="stat-pct" id="pct-luck">+0%</span></div>
    <div class="stat-box"><span class="stat-label">Final Dig Speed</span><span class="stat-val" id="final-dig">100%</span><span class="stat-pct" id="pct-dig">+0%</span></div>
    <div class="stat-box"><span class="stat-label">Final Shake Speed</span><span class="stat-val" id="final-shake">100%</span><span class="stat-pct" id="pct-shake">+0%</span></div>
    <div class="stat-box"><span class="stat-label">Final Size</span><span class="stat-val" id="final-size">100%</span><span class="stat-pct" id="pct-size">+0%</span></div>
</div>

<script>
    const config = [
        { id: 'COMMON', slots: 3, m: 0.005 },
        { id: 'UNCOMMON', slots: 3, m: 0.0075 },
        { id: 'RARE', slots: 3, m: 0.0125 },
        { id: 'EPIC', slots: 3, m: 0.02 },
        { id: 'LEGENDARY', slots: 3, m: 0.03 },
        { id: 'MYTHIC', slots: 2, m: 0.05 },
        { id: 'EXOTIC', slots: 1, m: 0.08 }
    ];

    const ores = [
        { n: "-- Select Ore --", b: 0, t: "none" },
        { n: "Vineheart (Exotic)", b: 0.8, t: "luck" },
        { n: "Astral Spore (Exotic)", b: 0.8, t: "dig" },
        { n: "Diamond (Legendary)", b: 0.3, t: "luck" },
        { n: "Star Garnet (Mythic)", b: 0.35, t: "size" },
        { n: "Bloodstone (Exotic)", b: 0.56, t: "size" },
        { n: "Specterite (Legendary)", b: 0.3, t: "shake" },
        { n: "North Star (Exotic)", b: 0.2, t: "all" },
        { n: "Eternium (Exotic)", b: 0.32, t: "mixed" }
    ];

    function init() {
        const root = document.getElementById('ui-root');
        config.forEach(r => {
            let slots = '';
            for(let i=0; i < r.slots; i++) {
                slots += `
                <div class="slot">
                    <select class="ore-sel" onchange="calc()">
                        ${ores.map(o => `<option value="${o.b}" data-type="${o.t}">${o.n}</option>`).join('')}
                    </select>
                    <select class="mod-sel" onchange="calc()">
                        <option value="${r.m}" data-treas="false">Normal Modifier</option>
                        <option value="${r.m}" data-treas="true">Treasured (2x Multiplier)</option>
                    </select>
                </div>`;
            }
            root.innerHTML += `<div class="card ${r.id}"><div class="card-header"><span style="color:var(--${r.id.toLowerCase()})">${r.id}</span> <span style="font-size:0.7rem; opacity:0.6">${r.slots} DISPLAYS</span></div>${slots}</div>`;
        });
        calc();
    }

    function calc() {
        let boosts = { luck: 0, dig: 0, shake: 0, size: 0 };
        
        document.querySelectorAll('.slot').forEach(slot => {
            const ore = slot.querySelector('.ore-sel');
            const mod = slot.querySelector('.mod-sel');
            const b = parseFloat(ore.value);
            const type = ore.options[ore.selectedIndex].getAttribute('data-type');
            const isTreas = mod.options[mod.selectedIndex].getAttribute('data-treas') === 'true';
            const m = parseFloat(mod.value);

            if (b > 0) {
                const totalSlot = b + (isTreas ? m * 2 : m);
                if (type === "all") { for(let k in boosts) boosts[k] += totalSlot; }
                else if (type === "mixed") { boosts.luck += totalSlot; boosts.dig += totalSlot; boosts.shake += totalSlot; }
                else if (boosts[type] !== undefined) boosts[type] += totalSlot;
            }
        });

        const baseStats = {
            luck: parseFloat(document.getElementById('base-luck').value) || 0,
            dig: parseFloat(document.getElementById('base-dig').value) || 0,
            shake: parseFloat(document.getElementById('base-shake').value) || 0,
            size: parseFloat(document.getElementById('base-size').value) || 0
        };

        // UI Updates
        updateDisplay('luck', baseStats.luck, boosts.luck, false);
        updateDisplay('dig', baseStats.dig, boosts.dig, true);
        updateDisplay('shake', baseStats.shake, boosts.shake, true);
        updateDisplay('size', baseStats.size, boosts.size, true);
    }

    function updateDisplay(id, base, boost, isPct) {
        const final = base * (1 + boost);
        const displayVal = isPct ? Math.round(final) + "%" : final.toFixed(2);
        document.getElementById(`final-${id}`).innerText = displayVal;
        document.getElementById(`pct-${id}`).innerText = `+${Math.round(boost * 100)}%`;
    }

    init();
</script>
</body>
</html>
